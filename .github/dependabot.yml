version: 2

# Monthly version-update PRs across the three ecosystems Void depends on.
# Security updates are handled separately (and always-on) by Dependabot itself
# regardless of this config — its cadence cannot be throttled here.
#
# Groupings keep PR noise low — a typical month is one PR per ecosystem instead
# of one per package. Limits cap the total open PRs so the inbox can't blow up.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      svelte:
        patterns:
          - "@sveltejs/*"
          - "svelte"
          - "svelte-*"
      tauri-js:
        patterns:
          - "@tauri-apps/*"
      prosemirror:
        patterns:
          - "prosemirror-*"
      testing:
        patterns:
          - "@vitest/*"
          - "vitest"
          - "happy-dom"
          - "@testing-library/*"
          - "@playwright/*"
      tailwind:
        patterns:
          - "@tailwindcss/*"
          - "tailwindcss"
          - "autoprefixer"
          - "postcss"

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      tauri-rust:
        patterns:
          - "tauri"
          - "tauri-*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(ci)"
      include: scope
