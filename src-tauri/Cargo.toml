[package]
name = "void"
version = "0.1.4"
description = "AI-powered note-taking app"
authors = ["intergalactisch"]
edition = "2021"
license = "MIT"
repository = "https://github.com/intergalactisch/void"
homepage = "https://github.com/intergalactisch/void"
readme = "../README.md"
keywords = ["notes", "tauri", "ai", "markdown", "macos"]
categories = ["text-editors"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "void_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify = "6"
notify-debouncer-full = "0.3"
arboard = "3"
tauri-plugin-updater = "2"
base64 = "0.22"
regex = "1"
sha2 = "0.10"
trash = "5"
aes-gcm = "0.10"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
objc2-foundation = { version = "0.3.2", features = ["NSURL", "NSData", "NSString", "NSArray", "NSError", "NSPathUtilities"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder"] }
